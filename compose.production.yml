services:
  nexus:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus:latest
    container_name: nexus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env.production
    networks:
      - caddy-net

networks:
  caddy-net:
    external: true
